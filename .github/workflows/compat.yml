name: Compatibilidade Paper

# Liga um servidor Paper real de cada versão (1.21.x até 26.x) com o plugin e verifica se tudo funciona.
on:
  push:
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
      latest_api: ${{ steps.api.outputs.latest }}
    steps:
      - name: Descobrir versões do Paper
        id: find
        run: |
          UA="UltraCore-CI (github.com/nicolaunoya-design/Projetos)"
          curl -fsSL -A "$UA" https://fill.papermc.io/v3/projects/paper > project.json
          LIST=$(jq -c '.versions | (if type=="object" then [.[][]] else . end)
                 | map(select(test("^1\\.21(\\.[0-9]+)?$") or test("^[2-9][0-9]\\.[0-9]+(\\.[0-9]+)?$")))
                 | unique' project.json)
          echo "Versões testadas: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
      - name: Descobrir a paper-api mais nova
        id: api
        run: |
          curl -fsSL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml > meta.xml
          LATEST=$(grep -oP '(?<=<latest>)[^<]+' meta.xml)
          echo "paper-api mais nova: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/UltraCore-*.jar

  compile-latest-api:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar contra a paper-api ${{ needs.versions.outputs.latest_api }}
        run: mvn -B compile -Dpaper.version=${{ needs.versions.outputs.latest_api }}

  server-test:
    needs: [versions, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
        vault: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: jar
      - name: Escolher Java
        id: java
        run: |
          if [[ "${{ matrix.mc }}" == 1.* ]]; then echo "v=21" >> "$GITHUB_OUTPUT"; else echo "v=25" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.v }}
      - name: Testar servidor Paper ${{ matrix.mc }} (Vault=${{ matrix.vault }})
        run: bash .github/scripts/test-server.sh "${{ matrix.mc }}" "$(ls jar/UltraCore-*.jar)" "${{ matrix.vault && 'vault' || '' }}"
