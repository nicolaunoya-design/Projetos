name: Descobrir texturas das cabeças

# Roda uma vez só (temporário): pergunta à Mojang qual é a textura das contas MHF_* (cabeças de mobs)
# e mostra o resultado nas anotações da execução (o GitHub mostra no máximo 10 por etapa).
on:
  push:
    paths:
      - '.github/workflows/descobrir-cabecas.yml'

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        names:
          - "MHF_CaveSpider MHF_Blaze MHF_Ghast MHF_Slime MHF_LavaSlime MHF_Enderman MHF_PigZombie MHF_Zombie MHF_Skeleton MHF_WSkeleton"
          - "MHF_Creeper MHF_Wolf MHF_Horse MHF_Rabbit MHF_Bat MHF_Witch MHF_Bee MHF_Cat MHF_Fox MHF_Parrot"
          - "MHF_Turtle MHF_Panda MHF_Llama MHF_Dolphin MHF_Phantom MHF_Wither MHF_Endermite MHF_Silverfish MHF_Guardian MHF_Vex"
          - "MHF_Pillager MHF_Goat MHF_Axolotl MHF_Frog MHF_Camel MHF_Allay MHF_Zoglin MHF_Hoglin MHF_Strider MHF_Piglin"
    steps:
      - name: Perguntar à Mojang
        run: |
          for N in ${{ matrix.names }}; do
            R=$(curl -sS --max-time 20 "https://api.mojang.com/users/profiles/minecraft/$N" || true)
            ID=$(echo "$R" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -z "$ID" ]; then echo "::notice::$N => nao existe"; sleep 1; continue; fi
            P=$(curl -sS --max-time 20 "https://sessionserver.mojang.com/session/minecraft/profile/$ID" || true)
            URL=$(echo "$P" | jq -r '.properties[]? | select(.name=="textures") | .value' | base64 -d 2>/dev/null | jq -r '.textures.SKIN.url // empty' 2>/dev/null || true)
            echo "::notice::$N => ${URL:-sem-textura (resposta: $(echo "$P" | head -c 120))}"
            sleep 2
          done
