name: Release UltraCore

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar plugin
        run: mvn -B package
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" target/UltraCore-*.jar \
            --title "UltraCore $TAG" \
            --notes "Plugin tudo-em-um para **Paper 1.21+** (Java 21).

          ### Como instalar
          1. Baixe o arquivo **UltraCore-*.jar** abaixo (em *Assets*).
          2. Coloque na pasta \`plugins/\` do servidor.
          3. Inicie o servidor, entre como OP e digite **/painel**.

          Veja o README para a lista de módulos, comandos e permissões."
