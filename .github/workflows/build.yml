name: Build UltraCore (manual)

# Compila e guarda o .jar como artefato. Roda só quando pedido (Actions > Run workflow).
# Os testes completos e a Release automática ficam em "Testes e Release" (compat.yml).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar plugin
        run: mvn -B package
      - name: Enviar .jar
        uses: actions/upload-artifact@v4
        with:
          name: UltraCore-plugin
          path: target/UltraCore-*.jar
