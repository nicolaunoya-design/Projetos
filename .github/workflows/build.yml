name: Build UltraCore

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar plugin
        run: mvn -B package
      - name: Enviar .jar
        uses: actions/upload-artifact@v4
        with:
          name: UltraCore-plugin
          path: target/UltraCore-*.jar
