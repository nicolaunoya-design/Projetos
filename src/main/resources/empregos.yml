# Empregos do UltraCore (parecido com o Jobs Reborn).
# Cada ação paga [dinheiro, xp] no nível 1. A cada nível o dinheiro sobe (opção "Bônus por nível" no /painel).
# Ações: quebrar, colocar, matar, pescar, craftar, fundir, encantar (por nível gasto), fermentar (por poção),
#        reproduzir, domar, tosquiar, colher, explorar (por chunk novo), forjar.
# Os alvos são nomes de itens/blocos/mobs do Minecraft em maiúsculas; "*" funciona como curinga (ex: *_LOG).
# O que não estiver na lista não paga. Proteções contra abuso (bloco colocado não paga, spawner, farm...)
# valem para todos. Depois de mudar, use /empregos admin recarregar.

